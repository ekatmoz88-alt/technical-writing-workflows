name: Documentation CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-api-and-docs:
    name: Validate OpenAPI Spec and Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate OpenAPI spec with Spectral
        uses: stoplightio/spectral-action@v0.8.0
        with:
          file_path: openapi/openapi.yaml

      - name: Lint Markdown documentation
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: docs/*.md
