name: Documentation CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-api-and-docs:
    name: Validate OpenAPI Spec and Markdown
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Spectral CLI
        run: npm install --global @stoplight/spectral-cli

      - name: Validate OpenAPI spec with Spectral
        run: spectral lint openapi/openapi.yaml

      - name: Lint Markdown documentation
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: docs/*.md

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-retries 5 --retry-wait-time 5 './**/*.md'
