openapi: 3.0.3
info:
  title: Sample Tasks API
  version: 1.0.0
  description: Minimal example API contract used to demonstrate documentation validation.
  contact:
    name: API documentation team
servers:
  - url: https://api.example.com/v1
tags:
  - name: Tasks
    description: Operations for managing sample tasks.
paths:
  /tasks:
    get:
      tags:
        - Tasks
      summary: List tasks
      description: Returns the collection of available tasks.
      operationId: listTasks
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      tags:
        - Tasks
      summary: Create a task
      description: Creates a task using the supplied title.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid request
components:
  schemas:
    Task:
      type: object
      required: [id, title, completed]
      properties:
        id:
          type: string
          example: task_123
        title:
          type: string
          example: Review API documentation
        completed:
          type: boolean
          example: false
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          example: Review API documentation
